[project]
name = "fwi-module"
version = "0.1.0"
description = "Canadian Fire Weather Index processing for Greece using ECMWF CDS CERRA datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"cdsapi>=0.7.7",
	"ecmwf-datastores-client>=0.5.1",
	"netCDF4>=1.7.2",
	"numpy>=2.1.0",
	"pydantic>=2.11.0",
	"PyYAML>=6.0.2",
	"regionmask>=0.13.0",
	"xarray>=2025.1.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3.0",
	"pytest-cov>=5.0.0",
]
grib = [
	"cfgrib>=0.9.15.0",
	"eccodes>=2.41.0",
]

[project.scripts]
fwi-module = "fwi_module.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwi_module"]
